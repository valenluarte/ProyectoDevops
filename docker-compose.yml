services:
  db-ventas:
    image: mysql:8.0
    container_name: db_proyecto_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin123
    volumes:
      - db_data:/var/lib/mysql
    entrypoint:
      - sh
      - -c
      - |
        echo "CREATE DATABASE IF NOT EXISTS tienda_Ventas;
        CREATE DATABASE IF NOT EXISTS tienda_Despachos;
        CREATE USER IF NOT EXISTS 'user_devops'@'%' IDENTIFIED BY 'password123';
        GRANT ALL PRIVILEGES ON tienda_Ventas.* TO 'user_devops'@'%';
        GRANT ALL PRIVILEGES ON tienda_Despachos.* TO 'user_devops'@'%';
        FLUSH PRIVILEGES;" > /tmp/init.sql
        /entrypoint.sh mysqld --init-file /tmp/init.sql
    networks:
      - red_interna
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  back-ventas:
    build: ./back-ventas_springboot
    container_name: backend_ventas
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-ventas:3306/tienda_Ventas
      SPRING_DATASOURCE_USERNAME: user_devops
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db-ventas:
        condition: service_healthy
    networks:
      - red_interna

  back-despachos:
    build: ./back-despachos_springboot
    container_name: backend_despachos
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-ventas:3306/tienda_Despachos
      SPRING_DATASOURCE_USERNAME: user_devops
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db-ventas:
        condition: service_healthy
    networks:
      - red_interna

networks:
  red_interna:
    driver: bridge

volumes:
  db_data:
