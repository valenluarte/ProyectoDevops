version: '3.8'

services:

  # Base de Datos Despachos (MySQL)
  db-despachos:
    build: 
      context: ./BD/BD-Despachos
      dockerfile: Dockerfile.prod
    container_name: back-despachos_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin123}
      MYSQL_DATABASE: tienda_Despachos
      MYSQL_USER: ${MYSQL_USER:-user_despachos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password_despachos}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - inventario_data_prod:/var/lib/mysql
    networks:
      - red_interna_prod
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-admin123} || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # Base de Datos Ventas (MySQL)
  db-ventas:
    build: 
      context: ./BD/BD-Ventas
      dockerfile: Dockerfile.prod
    container_name: back-ventas_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin123}
      MYSQL_DATABASE: tienda_Ventas
      MYSQL_USER: ${MYSQL_USER:-user_ventas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password_ventas}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - ventas_data_prod:/var/lib/mysql
    networks:
      - red_interna_prod
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-admin123} || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # Backend Ventas
  back-ventas:
    build: ./back-ventas_springboot
    container_name: backend_ventas
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/base_datos_app
      SPRING_DATASOURCE_USERNAME: user_devops
      SPRING_DATASOURCE_PASSWORD: password123
    depends_on:
      - db
    networks:
      - red_interna

  # Backend Despachos
  back-despachos:
        build: ./back-despachos_springboot
        container_name: backend_despachos
        environment:
          SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/base_datos_app
          SPRING_DATASOURCE_USERNAME: user_devops
          SPRING_DATASOURCE_PASSWORD: password123
        depends_on:
          - db
        networks:
          - red_interna

  # Frontend
  frontend:
    build: ./FRONT_DESPACHO
    container_name: frontend_app
    ports:
      - "80:80"
    depends_on:
      - back-ventas
      - back-despachos
    networks:
      - red_interna


networks:
  red_interna:
    driver: bridge

volumes:
  db_data: