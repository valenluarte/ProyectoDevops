name: Build, Push and Deploy Final Stack

on:
  push:
    branches:
      - deploy  # Cambiado de main a deploy para que funcione contigo
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker images
        run: |
          set -e
          # Construimos usando las carpetas que SI tenemos
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest ./back-ventas_springboot
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest ./back-despachos_springboot
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest ./FRONT_DESPACHO
          
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: us-east-1
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Prepare EC2 and Copy Files
        run: |
          # Creamos la carpeta en la EC2
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/proyectodevops"
          
          # Copiamos TU docker-compose.yml (el que arreglamos hoy)
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }}:~/proyectodevops/docker-compose.yml

      - name: Deploy and Validate in EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/proyectodevops
            
            # Crear el init.sql para que la base de datos no falle
            echo "CREATE DATABASE IF NOT EXISTS tienda_Ventas; CREATE DATABASE IF NOT EXISTS tienda_Despachos; CREATE USER IF NOT EXISTS 'user_devops'@'%' IDENTIFIED BY 'password123'; GRANT ALL PRIVILEGES ON tienda_Ventas.* TO 'user_devops'@'%'; GRANT ALL PRIVILEGES ON tienda_Despachos.* TO 'user_devops'@'%'; FLUSH PRIVILEGES;" > init.sql

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            docker compose pull
            docker compose down
            docker compose up -d

            echo "Esperando 20s a que suban los servicios..."
            sleep 20
            
            echo "--- ESTADO DE LOS CONTENEDORES ---"
            docker compose ps
            
            echo "--- VALIDANDO BASES DE DATOS ---"
            # Validamos que las tablas existan (esto asegura el punto de persistencia)
            docker exec proyectodevops-db-ventas-1 mysql -u root -padmin123 -e "SHOW DATABASES;"
            
            docker image prune -f
            echo "Despliegue finalizado con éxito en la rama deploy"
          EOF
